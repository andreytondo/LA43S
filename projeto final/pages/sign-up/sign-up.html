<section id="login-container" class="flex flex-column justify-center align-center">
    <div class="flex align-center justify-center gap-1">
        <img id="logo" src="./images/logo.png" alt="Logo Vinil.br">
        <h1>Vinil.br</h1>
    </div>
    <div id="auth-container" class="flex flex-column justify-center gap-1">
        <h1>Cadastre-se</h2>
        <form class="flex flex-column gap-2">
            <input type="text" id="email" placeholder="E-mail" maxlength="100" required>
            <input type="password" id="password" placeholder="Senha" maxlength="16" required>
            <input type="password" id="passwordConfirmation" placeholder="Confirme sua senha" maxlength="16" required>
        </form>
        <button id="sign-up-button" type="submit" class="primary">Cadastrar</button>
    </div>
</section>
